{% extends "base.html" %}

{% block content %}
<main class="container-fluid py-1" style="height: 92vh;">

    <div class="row h-100">
        <div class="col-8 h-100">
            <div class="row h-50">

                <div class="col-4 p-1 h-100">
                    <div class="bg-white shadow-sm border rounded-4 h-100 p-1 d-flex flex-column">
                        <input
                            id="search-input"
                            class="form-control rounded-4 p-2 border border-success-subtle bg-success bg-opacity-10 focus-ring focus-ring-success"
                            type="search"
                            placeholder="Search terms"
                            aria-label="Search terms"
                        >

                        <div class="d-flex flex-wrap align-items-center gap-3 flex-shrink-0 py-1">
                            <div class="form-check form-switch d-flex align-items-center gap-2 ps-0 mb-0">
                                <input
                                    class="form-check-input fs-3 m-0 flex-shrink-0 border-success-subtle"
                                    type="checkbox"
                                    role="switch"
                                    id="exact-match"
                                >

                                <label class="form-check-label" for="exact-match">
                                    Exact match
                                </label>
                            </div>

                            <div class="d-flex align-items-center gap-2 ms-auto">
                                <label class="text-nowrap" for="min-matches">
                                    Min matches
                                </label>

                                <input
                                    id="min-matches"
                                    class="form-control form-control-sm rounded-4 border-success-subtle focus-ring focus-ring-success"
                                    style="width: 65px;"
                                    type="number"
                                    min="1"
                                    step="1"
                                    value="1"
                                    required
                                >
                            </div>
                        </div>

                        <div id="selected-terms"
                             class="overflow-auto"
                             style="flex: 1; min-height: 0;">
                        </div>
                    </div>
                </div>

                <div class="col-8 p-1 h-100">
                    <div id="matching-genes"
                         class="bg-white shadow-sm border rounded-4 h-100 p-2 overflow-auto">
                    </div>
                </div>

            </div>

            <div class="row h-50">
                <div class="col-12 p-1 h-100">
                    <div id="genes-match-stats" class="bg-white shadow-sm border rounded-4 h-100 p-2 overflow-auto">
                    </div>
                </div>
            </div>
        </div>

        <div class="col-4 p-1 h-100">
            <div id="gene-match-summary" class="bg-white shadow-sm border rounded-4 h-100 p-2 overflow-auto"></div>
            </div>
        </div>
    </div>

</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/js/search.js') }}"></script>
{% endblock %}
